# Render Blueprint. After this repo is on GitHub:
# Render dashboard → New → Blueprint → select the repo.
databases:
  - name: fontenot-db
    databaseName: fontenot
    user: fontenot
    plan: basic-256mb

services:
  - type: web
    name: fontenot-engineering
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NITRO_PRESET
        value: render_com
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: fontenot-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
